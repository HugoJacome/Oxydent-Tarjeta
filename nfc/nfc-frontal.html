<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1012px;height:638px;overflow:hidden;font-family:'Segoe UI',sans-serif}
.card{
  width:1012px;height:638px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#f6ccd5 0%,#fbe3e9 45%,#fdf4f6 100%);
}
/* marco dorado interior */
.card::before{content:'';position:absolute;inset:18px;border:3px solid #c9a13b;border-radius:28px;pointer-events:none;opacity:.85}
/* palabras marca de agua */
.words{position:absolute;inset:0;overflow:hidden;opacity:.5}
.words span{position:absolute;font-weight:800;text-transform:uppercase;color:#fff;letter-spacing:4px}
/* logo */
.brand{position:absolute;top:58px;left:64px}
.brand .script{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:88px;line-height:1;color:#c9a13b;text-shadow:0 2px 0 #fff,0 5px 14px rgba(168,132,42,.35)}
.brand .sub{font-size:19px;letter-spacing:9px;text-transform:uppercase;color:#8d9094;font-weight:700;margin-top:10px}
/* nfc waves */
.nfc{position:absolute;top:58px;right:64px}
/* chip */
.chip{position:absolute;top:250px;left:70px;width:96px;height:70px;border-radius:14px;background:linear-gradient(135deg,#ecd9a0,#c9a13b 60%,#e8cf7a);box-shadow:0 3px 8px rgba(168,132,42,.4)}
.chip::after{content:'';position:absolute;inset:12px 9px;border:2.5px solid rgba(122,95,20,.45);border-radius:8px}
/* nombre */
.who{position:absolute;left:70px;bottom:70px}
.who .nm{font-size:41px;font-weight:800;letter-spacing:2.5px;color:#4a3f42}
.who .rl{font-size:21px;letter-spacing:5px;text-transform:uppercase;color:#c97786;font-weight:700;margin-top:10px}
.who .tel{font-size:19px;color:#8b7e81;margin-top:12px;font-weight:600}
/* QR */
.qrbox{position:absolute;right:64px;bottom:64px;background:#fff;padding:16px;border-radius:20px;box-shadow:0 8px 22px rgba(201,119,134,.35);border:3px solid #c9a13b}
.qrbox svg{display:block;width:190px;height:190px}
/* diente decorativo */
.tooth{position:absolute;right:330px;bottom:80px;opacity:.9}
</style>
</head>
<body>
<div class="card">
  <div class="words">
    <span style="top:200px;left:-30px;font-size:44px;transform:rotate(90deg)">Sonrisa</span>
    <span style="top:130px;left:400px;font-size:30px">Bienestar</span>
    <span style="bottom:220px;right:120px;font-size:26px">Prevención</span>
  </div>
  <div class="brand">
    <div class="script">Oxydent</div>
    <div class="sub">Servicios &nbsp;Odontológicos</div>
  </div>
  <svg class="nfc" width="86" height="86" viewBox="0 0 24 24" fill="none" stroke="#c9a13b" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 8.5a6 6 0 0 1 0 7"/><path d="M9.5 5.5a10 10 0 0 1 0 13"/><path d="M12.5 2.5a14 14 0 0 1 0 19"/></svg>
  <div class="chip"></div>
  <svg class="tooth" width="120" height="120" viewBox="0 0 100 100"><path d="M50 14 C38 4 16 8 14 30 C12 48 26 60 30 78 C32 88 40 92 43 84 C46 76 45 62 50 62 C55 62 54 76 57 84 C60 92 68 88 70 78 C74 60 88 48 86 30 C84 8 62 4 50 14 Z" fill="#dd93a0" opacity=".35"/><path d="M50 14 C38 4 16 8 14 30 C12 48 26 60 30 78 C32 88 40 92 43 84 C46 76 45 62 50 62 C55 62 54 76 57 84 C60 92 68 88 70 78 C74 60 88 48 86 30 C84 8 62 4 50 14 Z" fill="none" stroke="#c9a13b" stroke-width="2"/></svg>
  <div class="who">
    <div class="nm">DRA. JESSICA NÚÑEZ</div>
    <div class="rl">Odontóloga</div>
    <div class="tel">📞 096 413 1541 · Ambato</div>
  </div>
  <div class="qrbox" id="qr"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
var q=qrcode(0,'H');q.addData('https://oxydent.evowebec.com');q.make();
document.getElementById('qr').innerHTML=q.createSvgTag({scalable:true,margin:0});
</script>
</body>
</html>
