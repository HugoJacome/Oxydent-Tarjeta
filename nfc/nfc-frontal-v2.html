<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1012px;height:638px;overflow:hidden;font-family:'Segoe UI',sans-serif}
.card{
  width:1012px;height:638px;position:relative;overflow:hidden;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(221,147,160,.14), transparent 55%),
    radial-gradient(700px 400px at 0% 110%, rgba(201,161,59,.08), transparent 50%),
    linear-gradient(160deg,#fffdfb 0%,#fbf4f2 55%,#f7ecec 100%);
}
/* doble marco fino */
.card::before{content:'';position:absolute;inset:22px;border:1.5px solid #c9a13b;border-radius:24px;opacity:.8}
.card::after{content:'';position:absolute;inset:30px;border:1px solid rgba(201,161,59,.35);border-radius:18px}
/* curvas guilloche */
.curves{position:absolute;inset:0;opacity:.5}
/* logo */
.brand{position:absolute;top:84px;left:92px}
.script{
  font-family:'Palatino Linotype',Georgia,serif;font-style:italic;font-weight:700;font-size:92px;line-height:1;
  background:linear-gradient(170deg,#e2c26e 0%,#a8842a 45%,#dcb958 70%,#96731f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{display:flex;align-items:center;gap:16px;margin-top:16px}
.sub .ln{width:70px;height:1px;background:linear-gradient(90deg,#c9a13b,transparent)}
.sub .tx{font-size:16.5px;letter-spacing:8px;text-transform:uppercase;color:#9a8e91;font-weight:600}
/* diente monograma línea */
.tooth{position:absolute;top:78px;right:92px}
/* chip discreto */
.chip{position:absolute;left:92px;top:300px;width:74px;height:54px;border-radius:10px;background:linear-gradient(150deg,#e9d9ab,#c9a95c 55%,#e5cf90);box-shadow:0 2px 6px rgba(150,115,31,.3)}
.chip::after{content:'';position:absolute;inset:9px 7px;border:1.6px solid rgba(122,95,20,.35);border-radius:6px}
/* nombre */
.who{position:absolute;left:92px;bottom:96px}
.who .nm{font-family:'Palatino Linotype',Georgia,serif;font-size:44px;letter-spacing:3px;color:#3d3336;font-weight:600}
.who .rule{width:340px;height:1px;background:linear-gradient(90deg,#c9a13b 0%,rgba(201,161,59,.15) 100%);margin:16px 0}
.who .rl{font-size:17px;letter-spacing:6.5px;text-transform:uppercase;color:#b9848f;font-weight:600}
.who .tel{font-size:16.5px;letter-spacing:1.5px;color:#9a8e91;margin-top:14px}
/* QR discreto */
.qrwrap{position:absolute;right:92px;bottom:88px;text-align:center}
.qrbox{background:#fff;padding:13px;border-radius:16px;border:1.4px solid #c9a13b;box-shadow:0 6px 24px rgba(61,51,54,.12)}
.qrbox svg{display:block;width:160px;height:160px}
.qrlbl{font-size:11.5px;letter-spacing:3.5px;text-transform:uppercase;color:#9a8e91;margin-top:12px;font-weight:600}
/* nfc waves finas */
.nfc{position:absolute;right:106px;top:300px}
</style>
</head>
<body>
<div class="card">
  <svg class="curves" width="1012" height="638" viewBox="0 0 1012 638" fill="none">
    <path d="M-40 520 C 260 380 560 640 1052 430" stroke="rgba(201,161,59,.18)" stroke-width="1.2"/>
    <path d="M-40 560 C 280 420 580 680 1052 470" stroke="rgba(221,147,160,.22)" stroke-width="1.2"/>
    <path d="M-40 600 C 300 460 600 720 1052 510" stroke="rgba(201,161,59,.12)" stroke-width="1.2"/>
    <path d="M620 -20 C 700 160 940 200 1052 150" stroke="rgba(221,147,160,.18)" stroke-width="1.2"/>
    <path d="M680 -20 C 760 140 960 170 1052 120" stroke="rgba(201,161,59,.14)" stroke-width="1.2"/>
  </svg>
  <div class="brand">
    <div class="script">Oxydent</div>
    <div class="sub"><span class="ln"></span><span class="tx">Servicios Odontológicos</span></div>
  </div>
  <svg class="tooth" width="98" height="98" viewBox="0 0 100 100" fill="none">
    <path d="M50 16 C39 6 18 10 16 30 C14 47 27 58 31 76 C33 86 41 89 43.5 82 C46 74 45 62 50 62 C55 62 54 74 56.5 82 C59 89 67 86 69 76 C73 58 86 47 84 30 C82 10 61 6 50 16 Z" stroke="url(#g)" stroke-width="2.4"/>
    <path d="M34 30 C30 34 29 40 30 45" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#e2c26e"/><stop offset="1" stop-color="#a8842a"/></linearGradient></defs>
  </svg>
  <div class="chip"></div>
  <svg class="nfc" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#c9a13b" stroke-width="1.5" stroke-linecap="round" opacity=".85"><path d="M6.5 8.5a6 6 0 0 1 0 7"/><path d="M9.5 5.5a10 10 0 0 1 0 13"/><path d="M12.5 2.5a14 14 0 0 1 0 19"/></svg>
  <div class="who">
    <div class="nm">Dra. Jessica Núñez</div>
    <div class="rule"></div>
    <div class="rl">Odontóloga</div>
    <div class="tel">096 413 1541 &nbsp;·&nbsp; Ambato — Ecuador</div>
  </div>
  <div class="qrwrap">
    <div class="qrbox" id="qr"></div>
    <div class="qrlbl">Escanéame</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
var q=qrcode(0,'H');q.addData('https://oxydent.evowebec.com');q.make();
document.getElementById('qr').innerHTML=q.createSvgTag({scalable:true,margin:0});
</script>
</body>
</html>
