<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1012px;height:638px;overflow:hidden;font-family:'Segoe UI',sans-serif}
.card{
  width:1012px;height:638px;position:relative;overflow:hidden;text-align:center;
  background:linear-gradient(160deg,#4a3f42 0%,#3a3134 55%,#2b2426 100%);
}
.card::before{content:'';position:absolute;inset:18px;border:3px solid #c9a13b;border-radius:28px;opacity:.9}
.script{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:54px;color:#e8cf7a;margin-top:54px}
.sub{font-size:14px;letter-spacing:7px;text-transform:uppercase;color:#c9a5ab;font-weight:700;margin-top:4px}
.qrbox{display:inline-block;background:#fff;padding:18px;border-radius:22px;margin-top:28px;border:3px solid #c9a13b;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.qrbox svg{display:block;width:220px;height:220px}
.cta{font-size:24px;font-weight:700;color:#fff;margin-top:24px;letter-spacing:1px}
.cta small{display:block;font-size:17px;font-weight:400;color:#c9a5ab;margin-top:8px;letter-spacing:.5px}
.foot{position:absolute;bottom:44px;left:0;right:0;font-size:16px;color:#a89a9d;letter-spacing:1px}
.foot b{color:#e8cf7a}
.wave1{position:absolute;top:52px;left:60px}
.wave2{position:absolute;top:52px;right:60px;transform:scaleX(-1)}
</style>
</head>
<body>
<div class="card">
  <svg class="wave1" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#c9a13b" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 8.5a6 6 0 0 1 0 7"/><path d="M9.5 5.5a10 10 0 0 1 0 13"/><path d="M12.5 2.5a14 14 0 0 1 0 19"/></svg>
  <svg class="wave2" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#c9a13b" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 8.5a6 6 0 0 1 0 7"/><path d="M9.5 5.5a10 10 0 0 1 0 13"/><path d="M12.5 2.5a14 14 0 0 1 0 19"/></svg>
  <div class="script">Oxydent</div>
  <div class="sub">Nos gusta verte sonreír</div>
  <div class="qrbox" id="qr"></div>
  <div class="cta">Acércame a tu teléfono o escanea el código<small>y guarda nuestro contacto en un toque</small></div>
  <div class="foot">oxydent.evowebec.com &nbsp;·&nbsp; <b>096 413 1541</b> &nbsp;·&nbsp; Av. Antonio Clavijo y Sergio Núñez, Ambato</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
var q=qrcode(0,'H');q.addData('https://oxydent.evowebec.com');q.make();
document.getElementById('qr').innerHTML=q.createSvgTag({scalable:true,margin:0});
</script>
</body>
</html>
