<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1012px;height:638px;overflow:hidden;font-family:'Segoe UI',sans-serif}
.card{
  width:1012px;height:638px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#faeae6 0%,#f7e3e2 50%,#f3dcdc 100%);
}
/* patrón de dientes sutil */
.pattern{position:absolute;inset:0;opacity:.16}
/* diente gigante lateral */
.bigtooth{position:absolute;right:-140px;top:40px;opacity:.85}
/* contenido centrado */
.content{position:absolute;left:0;top:0;bottom:0;width:680px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:200px;height:200px}
.brand{
  font-family:'Segoe UI',sans-serif;font-weight:800;font-size:96px;line-height:1;margin-top:6px;
  background:linear-gradient(175deg,#e8cf7a 0%,#b8922e 40%,#f0dc9a 60%,#96731f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 3px 6px rgba(150,115,31,.15);
}
.sub{display:flex;align-items:center;gap:18px;margin-top:10px}
.sub span{font-size:19px;letter-spacing:5px;text-transform:uppercase;color:#8d9094;font-weight:700}
.sub .dot{width:7px;height:7px;border-radius:50%;background:#c9a13b}
.script{font-family:'Palatino Linotype',Georgia,serif;font-style:italic;font-weight:700;font-size:58px;color:#3d3336;margin-top:40px;letter-spacing:1.5px}
</style>
</head>
<body>
<div class="card">
  <svg class="pattern" width="1012" height="638">
    <defs><pattern id="tp" width="150" height="140" patternUnits="userSpaceOnUse">
      <path d="M40 18 C33 11 20 13 19 25 C18 35 26 42 28 53 C29 59 34 61 36 56 C38 51 37 44 40 44 C43 44 42 51 44 56 C46 61 51 59 52 53 C54 42 62 35 61 25 C60 13 47 11 40 18 Z" fill="none" stroke="#dda9b4" stroke-width="1.4" transform="rotate(-12 40 40)"/>
      <path d="M115 88 C108 81 95 83 94 95 C93 105 101 112 103 123 C104 129 109 131 111 126 C113 121 112 114 115 114 C118 114 117 121 119 126 C121 131 126 129 127 123 C129 112 137 105 136 95 C135 83 122 81 115 88 Z" fill="none" stroke="#dda9b4" stroke-width="1.4" transform="rotate(15 115 110)"/>
    </pattern></defs>
    <rect width="1012" height="638" fill="url(#tp)"/>
  </svg>
  <svg class="bigtooth" width="560" height="560" viewBox="0 0 100 100">
    <path d="M50 14 C38 4 16 8 14 30 C12 48 26 60 30 78 C32 88 40 92 43 84 C46 76 45 62 50 62 C55 62 54 76 57 84 C60 92 68 88 70 78 C74 60 88 48 86 30 C84 8 62 4 50 14 Z" fill="#dcebe7" opacity=".9"/>
  </svg>
  <div class="content">
    <img src="logo-completo.png" alt="Oxydent" style="width:470px;display:block">
    <div class="script">Dra. Jessica Núñez</div>
  </div>
  <div style="display:none">
    <svg class="logo" viewBox="0 0 100 100">
      <defs><clipPath id="tl"><path d="M50 14 C38 4 16 8 14 30 C12 48 26 60 30 78 C32 88 40 92 43 84 C46 76 45 62 50 62 Z"/></clipPath>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2c26e"/><stop offset="1" stop-color="#a8842a"/></linearGradient></defs>
      <path d="M50 14 C38 4 16 8 14 30 C12 48 26 60 30 78 C32 88 40 92 43 84 C46 76 45 62 50 62 C55 62 54 76 57 84 C60 92 68 88 70 78 C74 60 88 48 86 30 C84 8 62 4 50 14 Z" fill="#c3cfc9"/>
      <path d="M50 14 C38 4 16 8 14 30 C12 48 26 60 30 78 C32 88 40 92 43 84 C46 76 45 62 50 62 Z" fill="#e79aa8"/>
      <g clip-path="url(#tl)" fill="#fff" stroke="#fff">
        <path d="M33 22 L33 62" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <ellipse cx="26.5" cy="29" rx="5" ry="2.8" transform="rotate(-38 26.5 29)"/>
        <ellipse cx="39.5" cy="33" rx="5" ry="2.8" transform="rotate(38 39.5 33)"/>
        <ellipse cx="25.5" cy="41" rx="5" ry="2.8" transform="rotate(-38 25.5 41)"/>
        <ellipse cx="39.5" cy="45" rx="5" ry="2.8" transform="rotate(38 39.5 45)"/>
        <ellipse cx="27" cy="53" rx="4.6" ry="2.6" transform="rotate(-38 27 53)"/>
      </g>
      <path d="M50 14 C38 4 16 8 14 30 C12 48 26 60 30 78 C32 88 40 92 43 84 C46 76 45 62 50 62 C55 62 54 76 57 84 C60 92 68 88 70 78 C74 60 88 48 86 30 C84 8 62 4 50 14 Z" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
    </svg>
  </div>
</div>
</body>
</html>
