<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
/* DISEÑO PLANO PARA IMPRESORA EVOLIS: sin degradados, sin sombras, sin patrones tenues */
*{margin:0;padding:0;box-sizing:border-box}
body{width:1012px;height:638px;overflow:hidden;font-family:'Segoe UI',sans-serif;background:#fff}
.card{width:1012px;height:638px;position:relative;overflow:hidden;background:#ffffff}
/* banda lateral plana */
.side{position:absolute;left:0;top:0;bottom:0;width:64px;background:#E9A9B6}
.side2{position:absolute;left:64px;top:0;bottom:0;width:14px;background:#C9A13B}
.content{position:absolute;left:120px;right:60px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:440px;display:block}
.rule{width:380px;height:4px;background:#C9A13B;margin:24px 0 20px}
.name{font-family:'Palatino Linotype',Georgia,serif;font-style:italic;font-weight:700;font-size:50px;color:#3D3336;letter-spacing:1px}
.tel{font-size:22px;color:#8A7B7E;margin-top:12px;letter-spacing:2px;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="side"></div>
  <div class="side2"></div>
  <div class="content">
    <img class="logo" src="logo-completo.png" alt="Oxydent">
    <div class="rule"></div>
    <div class="name">Dra. Jessica Núñez</div>
    <div class="tel">096 413 1541 · AMBATO</div>
  </div>
</div>
</body>
</html>
